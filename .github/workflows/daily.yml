name: Daily News

on:
  schedule:
    # 매일 한국시간 오전 7:30 (UTC 22:30). GitHub 사정으로 몇 분 늦을 수 있습니다.
    - cron: "30 22 * * *"
  workflow_dispatch:   # Actions 탭에서 수동으로도 실행할 수 있습니다.

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build news page
        run: python fetch_news.py

      - name: Commit page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Update news"
          git push
