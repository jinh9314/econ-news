name: Daily Briefing

on:
  schedule:
    # 매일 한국시간 오전 7:30 (UTC 22:30). GitHub 사정으로 몇 분 늦을 수 있습니다.
    - cron: "30 22 * * *"
  workflow_dispatch:   # Actions 탭에서 수동으로도 실행할 수 있습니다.
  push:
    # 나의 월간 분석(jb/notes.txt)을 저장하면 기사를 새로 모으지 않고 페이지만 다시 만듭니다.
    branches: [main]
    paths: ["jb/notes.txt"]

permissions:
  contents: write

concurrency:
  group: briefing
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 대기하다 늦게 시작한 실행도 예전 커밋이 아니라 항상 최신 main 위에서 페이지를 만듭니다.
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build pages
        env:
          # 저장소 Settings → Secrets → Actions에 넣어 둔 키입니다. 없으면 AI 없이 문장 발췌 방식으로 만듭니다.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # (선택) 한국은행 ECOS 키. 있으면 한국 기준금리 줄이 자동으로 채워집니다. 없으면 그 줄만 숨겨집니다.
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: python briefing.py ${{ github.event_name == 'push' && '--rebuild' || '' }}

      - name: Commit pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html archive jb analysis market
          git diff --cached --quiet && exit 0
          git commit -m "Update pages"
          # 그사이 다른 커밋이 올라와 자동 생성 페이지가 충돌하면, 방금 만든 페이지를 우선합니다.
          # (rebase 중의 -X theirs = 지금 다시 적용하는 이 실행의 커밋)
          for i in 1 2 3; do
            if git pull --rebase -X theirs && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          exit 1
